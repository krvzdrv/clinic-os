# Render Blueprint — деплой clinic-os как Web Service.
# https://render.com/docs/blueprint-spec
#
# После подключения репозитория Render сам создаст сервис по этому файлу.
# DATABASE_URL нужно задать вручную в панели Render (секрет, sync: false).

services:
  - type: web
    name: clinic-os
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -b 0.0.0.0:${PORT:-5000} --workers 2 --access-logfile -
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false   # задаётся вручную в панели Render (значение из Supabase)
