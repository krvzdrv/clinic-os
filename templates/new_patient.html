<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый пациент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='clinic.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
  .wrap{max-width:520px;}
  h1{font-weight:650;font-size:1.4rem;letter-spacing:-.02em;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--faint);margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:6px;}
  .field label .ti{font-size:13px;letter-spacing:normal;}
  .field input,.field select{width:100%;padding:10px 12px;font-size:15px;font-family:var(--font);border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid color-mix(in srgb, var(--accent) 35%, transparent);border-color:var(--accent);}
  .row{display:flex;gap:12px;}
  .row .field{flex:1;}
  .btn{display:block;width:100% !important;padding:12px;font-size:15px;border-radius:10px;margin-top:8px;}
  /* Дата рождения — три отдельных поля, не type="date": для года вроде 1967
     родной календарь пришлось бы прокликивать месяц за месяцем назад.
     Год печатается цифрами сразу, без навигации. */
  .dob-row{
    display:flex;gap:8px;align-items:stretch;
    width:100%;max-width:100%;box-sizing:border-box;
  }
  .dob-row input,.dob-row select{box-sizing:border-box;min-width:0;}
  .dob-row input{text-align:center;}
  /* День — 2 цифры, год — 4; месяц забирает оставшуюся ширину формы. */
  .dob-row input#dob_day{flex:0 0 3.25em;width:3.25em;padding-left:8px;padding-right:8px;}
  .dob-row input#dob_year{flex:0 0 4.75em;width:4.75em;padding-left:8px;padding-right:8px;}
  .dob-row select#dob_month{flex:1 1 0;width:auto;}
</style>
</head>
<body>
<main class="wrap">
  <a href="{{ url_for('dashboard') }}" class="back">← К списку пациентов</a>
  <h1>Новый пациент</h1>
  <div class="sub">Заполните ФИО, пол и дату рождения. Диагноз и препараты добавляются в карте.</div>

  <form method="POST">
    <div class="field">
      <label><i class="ti ti-user" aria-hidden="true"></i>Фамилия</label>
      <input type="text" name="family" required autofocus>
    </div>
    <div class="field">
      <label><i class="ti ti-user" aria-hidden="true"></i>Имя</label>
      <input type="text" name="given" required>
    </div>
    <div class="field">
      <label><i class="ti ti-user" aria-hidden="true"></i>Отчество</label>
      <input type="text" name="patronymic">
    </div>
    <div class="field">
      <label><i class="ti ti-gender-bigender" aria-hidden="true"></i>Пол</label>
      <select name="gender">
        <option value="male">мужской</option>
        <option value="female">женский</option>
      </select>
    </div>
    <div class="field">
      <label><i class="ti ti-calendar" aria-hidden="true"></i>Дата рождения</label>
      <div class="dob-row">
        <input type="text" inputmode="numeric" maxlength="2" id="dob_day" placeholder="ДД" aria-label="День рождения">
        <select id="dob_month" aria-label="Месяц рождения">
          <option value="">Месяц</option>
          <option value="01">январь</option>
          <option value="02">февраль</option>
          <option value="03">март</option>
          <option value="04">апрель</option>
          <option value="05">май</option>
          <option value="06">июнь</option>
          <option value="07">июль</option>
          <option value="08">август</option>
          <option value="09">сентябрь</option>
          <option value="10">октябрь</option>
          <option value="11">ноябрь</option>
          <option value="12">декабрь</option>
        </select>
        <input type="text" inputmode="numeric" maxlength="4" id="dob_year" placeholder="ГГГГ" aria-label="Год рождения">
      </div>
      <input type="hidden" name="birth_date" id="birth_date_iso">
    </div>
    <button class="btn" type="submit">Создать карту</button>
  </form>
</main>
<script>
  // День/месяц/год печатаются цифрами напрямую — без прокликивания месяцев
  // родного календаря назад к нужному году. Собираем ISO-дату в скрытое поле.
  (function(){
    var day = document.getElementById('dob_day');
    var month = document.getElementById('dob_month');
    var year = document.getElementById('dob_year');
    var iso = document.getElementById('birth_date_iso');
    function pad2(v){ v = String(v||'').trim(); return v.length === 1 ? '0' + v : v; }
    function sync(){
      var d = parseInt(day.value, 10), m = month.value, y = parseInt(year.value, 10);
      if (day.value && m && year.value && year.value.length === 4 &&
          d >= 1 && d <= 31 && y >= 1900 && y <= new Date().getFullYear()) {
        iso.value = y + '-' + m + '-' + pad2(d);
      } else {
        iso.value = '';
      }
    }
    [day, month, year].forEach(function(el){ el.addEventListener('input', sync); el.addEventListener('change', sync); });
    day.addEventListener('blur', function(){ if (day.value) day.value = pad2(day.value); });
  })();
</script>
{% include "_double_submit_guard.html" %}
</body>
</html>
