<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый пациент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='clinic.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
  .wrap{max-width:520px;}
  h1{font-weight:650;font-size:1.4rem;letter-spacing:-.02em;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--faint);margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:6px;}
  .field label .ti{font-size:13px;letter-spacing:normal;}
  .field input,.field select{width:100%;padding:10px 12px;font-size:15px;font-family:var(--font);border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid color-mix(in srgb, var(--accent) 35%, transparent);border-color:var(--accent);}
  .row{display:flex;gap:12px;}
  .row .field{flex:1;}
  /* Высота/шрифт — SSOT в clinic.css (.btn = 32px); здесь только на всю ширину формы. */
  .btn{display:flex;width:100% !important;margin-top:8px;box-sizing:border-box;}
  /* Дата рождения — одна рамка, три одинаковых сегмента (не три «плашки»).
     Месяц тоже input: нативный select всегда выше/темнее соседних полей. */
  .dob-row{
    display:grid;
    grid-template-columns:1fr 1fr 1.35fr;
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    overflow:hidden;
  }
  .dob-row input{
    width:100%;min-width:0;box-sizing:border-box;
    height:42px;padding:0 12px;margin:0;
    border:0;border-radius:0;background:transparent;
    font-size:15px;font-family:var(--font);color:var(--ink);
    text-align:center;
  }
  .dob-row input + input{border-left:1px solid var(--line);}
  .dob-row input:focus{
    outline:none;
    background:color-mix(in srgb, var(--accent) 6%, transparent);
    box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .dob-row input::placeholder{color:var(--faint);font-weight:400;}
</style>
</head>
<body>
<main class="wrap">
  <a href="{{ url_for('dashboard') }}" class="back">← К списку пациентов</a>
  <h1>Новый пациент</h1>
  <div class="sub">Заполните ФИО, пол и дату рождения. Диагноз и препараты добавляются в карте.</div>

  <form method="POST">
    <div class="field">
      <label><i class="ti ti-user" aria-hidden="true"></i>Фамилия</label>
      <input type="text" name="family" required autofocus>
    </div>
    <div class="field">
      <label><i class="ti ti-user" aria-hidden="true"></i>Имя</label>
      <input type="text" name="given" required>
    </div>
    <div class="field">
      <label><i class="ti ti-user" aria-hidden="true"></i>Отчество</label>
      <input type="text" name="patronymic">
    </div>
    <div class="field">
      <label><i class="ti ti-gender-bigender" aria-hidden="true"></i>Пол</label>
      <select name="gender">
        <option value="male">мужской</option>
        <option value="female">женский</option>
      </select>
    </div>
    <div class="field">
      <label><i class="ti ti-calendar" aria-hidden="true"></i>Дата рождения</label>
      <div class="dob-row">
        <input type="text" inputmode="numeric" maxlength="2" id="dob_day" placeholder="ДД" aria-label="День рождения" autocomplete="bday-day">
        <input type="text" inputmode="numeric" maxlength="2" id="dob_month" placeholder="ММ" aria-label="Месяц рождения" autocomplete="bday-month">
        <input type="text" inputmode="numeric" maxlength="4" id="dob_year" placeholder="ГГГГ" aria-label="Год рождения" autocomplete="bday-year">
      </div>
      <input type="hidden" name="birth_date" id="birth_date_iso">
    </div>
    <button class="btn" type="submit">Создать карту</button>
  </form>
</main>
<script>
  // День/месяц/год цифрами — без нативного select (он визуально ломал ряд)
  // и без прокликивания родного календаря. ISO собираем в скрытое поле.
  (function(){
    var day = document.getElementById('dob_day');
    var month = document.getElementById('dob_month');
    var year = document.getElementById('dob_year');
    var iso = document.getElementById('birth_date_iso');
    function pad2(v){ v = String(v||'').trim(); return v.length === 1 ? '0' + v : v; }
    function digitsOnly(el, max){
      el.value = String(el.value || '').replace(/\D/g, '').slice(0, max);
    }
    function sync(){
      var d = parseInt(day.value, 10), m = parseInt(month.value, 10), y = parseInt(year.value, 10);
      if (day.value && month.value && year.value && year.value.length === 4 &&
          d >= 1 && d <= 31 && m >= 1 && m <= 12 &&
          y >= 1900 && y <= new Date().getFullYear()) {
        iso.value = y + '-' + pad2(m) + '-' + pad2(d);
      } else {
        iso.value = '';
      }
    }
    [day, month, year].forEach(function(el){
      el.addEventListener('input', function(){
        digitsOnly(el, el === year ? 4 : 2);
        sync();
      });
      el.addEventListener('change', sync);
    });
    day.addEventListener('blur', function(){ if (day.value) day.value = pad2(day.value); sync(); });
    month.addEventListener('blur', function(){ if (month.value) month.value = pad2(month.value); sync(); });
  })();
</script>
{% include "_double_submit_guard.html" %}
</body>
</html>
