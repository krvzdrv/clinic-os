<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запись АД — {{ full_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf9f5; --ink:#20201c; --soft:#54524a; --faint:#8a877d;
    --coral:#d97757; --coral-deep:#c25e3f; --line:#e6e3d9; --tint:#f3f1e9;
  }
  *,*::before,*::after{box-sizing:border-box;} *{margin:0;padding:0;}
  body{font-family:"Inter",sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5;}
  .wrap{max-width:480px;margin:0 auto;padding:32px 24px;}
  .back{font-size:13px;color:var(--faint);text-decoration:none;margin-bottom:16px;display:inline-block;}
  .back:hover{color:var(--coral-deep);}
  h1{font-family:"Spectral",serif;font-weight:600;font-size:22px;letter-spacing:-.01em;margin-bottom:4px;}
  .sub{font-size:13px;color:var(--faint);margin-bottom:24px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:6px;}
  .field input{width:100%;padding:10px 12px;font-size:15px;font-family:"Inter",sans-serif;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--coral);}
  .bp-row{display:flex;gap:12px;}
  .bp-row .field{flex:1;}
  .bp-sep{align-self:flex-end;padding-bottom:10px;font-size:18px;color:var(--faint);}
  .btn{display:block;width:100%;padding:12px;background:var(--coral);color:#fff;font-size:15px;font-weight:600;border:none;border-radius:10px;cursor:pointer;margin-top:8px;}
  .btn:hover{background:var(--coral-deep);}
  .hint{margin-top:16px;padding:12px 14px;background:var(--tint);border-radius:8px;font-size:12px;color:var(--soft);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <a href="{{ url_for('patient_detail', pid=patient.id) }}" class="back">← Назад к карте</a>
  <h1>Запись измерения АД</h1>
  <div class="sub">{{ full_name }} · {{ patient.id }}</div>

  <form method="POST">
    <div class="bp-row">
      <div class="field">
        <label>Систолическое (мм рт. ст.)</label>
        <input type="number" name="systolic" min="60" max="250" placeholder="140" required autofocus>
      </div>
      <div class="bp-sep">/</div>
      <div class="field">
        <label>Диастолическое (мм рт. ст.)</label>
        <input type="number" name="diastolic" min="40" max="150" placeholder="90" required>
      </div>
    </div>
    <div class="field">
      <label>Дата измерения</label>
      <input type="date" name="date" value="{{ '' }}">
    </div>
    <button type="submit" class="btn">Сохранить измерение</button>
  </form>

  <div class="hint">
    После сохранения система автоматически пересчитает:
    контроль АД, передержку наблюдения и подсказки для врача.
    Метрика качества на дашборде обновится сразу.
  </div>
</div>
</body>
</html>
